<!DOCTYPE html>
<html>
<head>
    <title>Update Contact - NHP Bank</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .form-container {
            background-color: white;
            display: inline-block;
            padding: 30px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: left;
            width: 300px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Update Contact</h2>
    <form method="POST" action="/pfmanage/upcontact">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter Username" required>

        <label for="mailid">Email:</label>
        <input type="text" id="mailid" name="mailid" placeholder="Enter Email">

        <label for="phoneno">Phone Number:</label>
        <input type="number" id="phoneno" name="phoneno" placeholder="Enter Phone Number">

        <button type="submit">Update Contact</button>
    </form>
</div>

</body>
</html>
