<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NHP Deposit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f9;
        }

        h2 {
            text-align: center;
        }

        p1{
            text-align: center;
        }

        

        

       

        .nav-menu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 40px;
            max-width: 900px;
            margin: 40px auto;
        }

        .nav-item1 {
            background-color: #0077cc;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .nav-item2 {
            
            color: red;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            border-radius: 10px;
            text-decoration-line: underline;
            transition: background-color 0.3s ease;
        }

        .nav-item:hover {
            background-color: #005fa3;
          
        }

        .account-choice{
            display: flex;
            justify-content: flex-start;
            padding-left: 80px;
            align-items: center;
            font-size: 2rem;
            gap: 72px;
        
        }
        .account-choice-select{
            width: 700px;
            font-size: 1.1rem;
            padding: 10px;

        }
        .deposit-amount{
            display: flex;
            justify-content: flex-start;
            padding-left: 80px;
            align-items: center;
            font-size: 2rem;
            gap: 50px;
        }

        .deposit-amount-input{
            height: 50px;
            width: 300px;
            font-size: 1.1rem;
        }

    </style>
</head>
<body>

    <h2>NHP Withdraw</h2>
    <br><br><br>

    <form method="POST" action="{{ url_for('withdraw_amount') }}">
        <div class="account-choice">
            <label class="account-choice-label">Your Accounts:</label>
            <select class="account-choice-select" name="account_id" required>
                {% for account in accounts %}
                <option value="{{ account.account_id }}">
                    {{ account.account_type }} A/C: {{ account.account_number }} Balance: ₹{{ "{:,.2f}".format(account.balance) }}
                </option>
                {% endfor %}
            </select>
        </div>

        <br><br><br>

        <div class="deposit-amount">
            <label class="deposit-amount-label" for="amount">withdraw Amount:</label>
            <input class="deposit-amount-input" type="number" name="amount" id="amount" step="0.01" required>
        </div>

        <br><br><br>

        <div class="nav-menu">
            <button type="submit" class="nav-item1">withdraw</button>
            <a href="/dashboard/withdraw" class="nav-item1">Cancel</a>
            <a href="/dashboard" class="nav-item2">Back To Dashboard</a>
        </div>
    </form>

</body>
</html>
