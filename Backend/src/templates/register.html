<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form {
            background-color: white;
            display: inline-block;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"], input[type="password"], input[type="number"] {
            width: 250px;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Welcome to NHP Bank - Registration</h1>

    <form method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter Full Name" required>

        <label for="mailid">Email:</label>
        <input type="text" id="mailid" name="mailid" placeholder="Enter Email" required>

        <label for="phoneno">Phone Number:</label>
        <input type="number" id="phoneno" name="phoneno" placeholder="Enter Phone Number" required>

        <label for="desiredUsername">Desired Username:</label>
        <input type="text" id="desiredUsername" name="desiredUsername" placeholder="Enter Username" required>

        <label for="password">Choose Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>

        <label for="confirmpassword">Confirm Password:</label>
        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm Password" required>

        <button type="submit">Register</button>  
    </form>
    <a href="/">Back to Login</a>


</body>
</html>
